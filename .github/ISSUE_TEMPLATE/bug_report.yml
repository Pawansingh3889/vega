name: Bug report
description: Something behaves differently from how it is documented
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest set of steps that shows it.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `node -v`, `uv --version`, and whether you are on Docker or Podman.
      placeholder: "node v22.x, uv 0.11.x, podman"

  - type: checkboxes
    id: gate
    attributes:
      label: Does `make gate` pass on a clean checkout of `main`?
      description: If it does not, that is the bug, and worth saying so.
      options:
        - label: I checked
