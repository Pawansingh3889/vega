    <!-- Security Headers via Meta Tags (Note: Some headers should be set server-side) -->
    <!--
      Content Security Policy.

      THREE THINGS WERE WRONG IN THE INHERITED VERSION, and the third is not a typo:

      1. connect-src named the OLD Rigel project, so this app could not reach
         Vega's Supabase at all.
      2. script-src allowed https://esm.sh and https://cdn.jsdelivr.net plus
         'unsafe-eval'. Nothing here loads from either CDN, and a script-src a
         page does not use is an open door with nothing behind it.
      3. frame-ancestors and X-Frame-Options were set in <meta>, WHERE BROWSERS
         IGNORE THEM. Both are header-only directives. The page looked protected
         against clickjacking and was not. They are kept below for the CSP
         reporting tools that read meta, but the real protection has to come from
         a response header at the host: see apps/web/public/_headers.

      connect-src carries the Supabase project and the Vega API (the FastAPI
      service on Fly; scripts/deploy-api.sh prints the same origin). The dev
      server adds http://localhost:8000 via its CSP response header so a
      locally running API is reachable; see vite.config.ts.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://kscgvfzzzbmqohuuiiab.supabase.co wss://kscgvfzzzbmqohuuiiab.supabase.co https://vega-api.fly.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()" />
    
    <!-- Optional: Cloudflare Turnstile site key (public). Set this to enable captcha: -->
    <meta name="turnstile-sitekey" content="" />
